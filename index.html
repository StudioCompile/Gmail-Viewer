<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gmail Viewer</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ffffff'/%3E%3Crect x='3' y='7' width='26' height='18' fill='none' stroke='%237a2020' stroke-width='2'/%3E%3Cpath d='M4 8l12 10 12-10' fill='none' stroke='%237a2020' stroke-width='2'/%3E%3C/svg%3E">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --ink: #1a1a1a;
    --ink-soft: #6b6b6b;
    --ink-faint: #9a9a9a;
    --line: #dcdcdc;
    --line-soft: #ececec;
    --bg: #fafafa;
    --panel: #ffffff;
    --accent: #7a2020;
    --hover: #f4f4f4;
    --selected: #f0e9e9;
  }

  * { box-sizing: border-box; border-radius: 0 !important; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", "Segoe UI Web", Tahoma, Geneva, Verdana, sans-serif;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 24px;
    height: 56px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }

  header img.logo {
    width: 22px;
    height: 22px;
    object-fit: contain;
  }

  header h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }

  header .spacer { flex: 1; }

  .btn {
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px 16px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    cursor: pointer;
  }

  .btn:hover { background: var(--hover); }

  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .btn.primary:hover { background: #5f1919; }

  #status {
    font-size: 11.5px;
    color: var(--ink-faint);
    text-align: center;
    padding: 6px 0 0 0;
  }

  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 20px 60px 20px;
  }

  .list-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
    margin-bottom: 4px;
  }

  .list-header .eyebrow {
    font-size: 11px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  #emailList {
    background: var(--panel);
    border: 1px solid var(--line);
    border-top: none;
  }

  .email-item {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line-soft);
    cursor: pointer;
  }

  .email-item:hover { background: var(--hover); }

  .email-item .dot {
    width: 6px;
    height: 6px;
    background: var(--accent);
    flex-shrink: 0;
    visibility: hidden;
    align-self: center;
  }

  .email-item.unread .dot { visibility: visible; }

  .email-item .from {
    font-size: 13px;
    color: var(--ink);
    width: 170px;
    flex-shrink: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .email-item.unread .from { font-weight: 700; }

  .email-item .subject-wrap {
    flex: 1;
    min-width: 0;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--ink-soft);
  }

  .email-item .subject-wrap .subject {
    color: var(--ink);
  }

  .email-item.unread .subject-wrap .subject { font-weight: 700; }

  .email-item .subject-wrap .dash { color: var(--ink-faint); margin: 0 4px; }

  .email-item .date {
    font-size: 11.5px;
    color: var(--ink-faint);
    flex-shrink: 0;
    width: 60px;
    text-align: right;
  }

  .loading-row, .empty-row {
    padding: 20px 16px;
    font-size: 13px;
    color: var(--ink-faint);
    text-align: center;
  }

  #loadMoreWrap {
    display: flex;
    justify-content: center;
    margin-top: 16px;
  }

  #loadMoreBtn { display: none; }

  /* Detail view */
  #detailView { display: none; }

  .back-link {
    display: inline-block;
    font-size: 12.5px;
    color: var(--ink-soft);
    cursor: pointer;
    margin-bottom: 16px;
    padding-bottom: 2px;
    border-bottom: 1px solid var(--ink-faint);
  }

  .back-link:hover { color: var(--ink); border-color: var(--ink); }

  .detail-card {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 28px 30px;
  }

  .detail-subject {
    font-size: 19px;
    font-weight: 700;
    margin: 0 0 16px 0;
  }

  .detail-meta {
    border-top: 1px solid var(--line-soft);
    border-bottom: 1px solid var(--line-soft);
    padding: 12px 0;
    margin-bottom: 20px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  .detail-meta .meta-row {
    display: flex;
    gap: 10px;
    margin: 3px 0;
  }

  .detail-meta .meta-label {
    width: 44px;
    flex-shrink: 0;
    font-weight: 700;
    color: var(--ink-faint);
    text-transform: uppercase;
    font-size: 10.5px;
    letter-spacing: 0.4px;
    padding-top: 1px;
  }

  .detail-body {
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--ink);
    white-space: pre-wrap;
    word-wrap: break-word;
  }
</style>
</head>
<body>

  <header>
    <img class="logo" src="Logo.png" alt="Logo">
    <h1>Gmail Viewer</h1>
    <div class="spacer"></div>
    <button class="btn primary" id="authBtn" onclick="handleAuthClick()">Connect Gmail</button>
    <button class="btn" id="signoutBtn" onclick="handleSignoutClick()" style="display:none;">Disconnect</button>
  </header>
  <div id="status"></div>

  <div class="page">

    <div id="listView">
      <div class="list-header">
        <span class="eyebrow">Inbox</span>
        <span class="eyebrow" id="countLabel"></span>
      </div>
      <div id="emailList">
        <div class="empty-row">Connect your Gmail account to see messages here.</div>
      </div>
      <div id="loadMoreWrap">
        <button class="btn" id="loadMoreBtn" onclick="loadMore()">Load more mail</button>
      </div>
    </div>

    <div id="detailView">
      <span class="back-link" onclick="showList()">← Back to inbox</span>
      <div class="detail-card">
        <p class="detail-subject" id="detailSubject"></p>
        <div class="detail-meta">
          <div class="meta-row"><span class="meta-label">From</span><span id="detailFrom"></span></div>
          <div class="meta-row"><span class="meta-label">To</span><span id="detailTo"></span></div>
          <div class="meta-row"><span class="meta-label">Date</span><span id="detailDate"></span></div>
        </div>
        <div class="detail-body" id="detailBody"></div>
      </div>
    </div>

  </div>

  <script>
    let tokenClient;
    let accessToken = null;
    let nextPageToken = null;
    let allItems = [];
    const SCOPE = "https://www.googleapis.com/auth/gmail.readonly";
    const CLIENT_ID = "150167267776-4p30kghhgubv8n18jcd53tq1u41cbhkv.apps.googleusercontent.com";

    function setStatus(text) {
      document.getElementById('status').innerText = text;
    }

    function initTokenClient() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPE,
        callback: (tokenResponse) => {
          accessToken = tokenResponse.access_token;
          document.getElementById('authBtn').style.display = 'none';
          document.getElementById('signoutBtn').style.display = 'inline-block';
          setStatus("Connected. Loading emails...");
          allItems = [];
          nextPageToken = null;
          document.getElementById('emailList').innerHTML = '<div class="loading-row">Loading messages...</div>';
          fetchPage();
        },
      });
    }

    function handleAuthClick() {
      if (!tokenClient) initTokenClient();
      tokenClient.requestAccessToken();
    }

    function handleSignoutClick() {
      if (accessToken) {
        google.accounts.oauth2.revoke(accessToken, () => {
          accessToken = null;
          allItems = [];
          nextPageToken = null;
          document.getElementById('authBtn').style.display = 'inline-block';
          document.getElementById('signoutBtn').style.display = 'none';
          document.getElementById('emailList').innerHTML = '<div class="empty-row">Connect your Gmail account to see messages here.</div>';
          document.getElementById('loadMoreBtn').style.display = 'none';
          document.getElementById('countLabel').innerText = '';
          showList();
          setStatus("Disconnected.");
        });
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.innerText = str == null ? "" : str;
      return div.innerHTML;
    }

    function getHeader(headers, name) {
      const h = headers.find(h => h.name.toLowerCase() === name.toLowerCase());
      return h ? h.value : "";
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr);
      if (isNaN(d)) return dateStr || "";
      const now = new Date();
      const sameDay = d.toDateString() === now.toDateString();
      if (sameDay) {
        return d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
      }
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }

    function decodeBase64Url(data) {
      if (!data) return "";
      let base64 = data.replace(/-/g, '+').replace(/_/g, '/');
      while (base64.length % 4) base64 += '=';
      try {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return new TextDecoder('utf-8').decode(bytes);
      } catch (e) {
        return "";
      }
    }

    function stripHtml(html) {
      const div = document.createElement('div');
      div.innerHTML = html;
      return div.textContent || div.innerText || "";
    }

    function extractBody(payload) {
      let plain = null;
      let html = null;

      function walk(part) {
        if (!part) return;
        if (part.mimeType === 'text/plain' && part.body && part.body.data) {
          plain = plain || decodeBase64Url(part.body.data);
        } else if (part.mimeType === 'text/html' && part.body && part.body.data) {
          html = html || decodeBase64Url(part.body.data);
        }
        if (part.parts) {
          for (const p of part.parts) walk(p);
        }
      }

      walk(payload);

      if (plain) return plain;
      if (html) return stripHtml(html);
      if (payload.body && payload.body.data) return decodeBase64Url(payload.body.data);
      return "(no readable content)";
    }

    async function fetchPage() {
      try {
        let url = "https://gmail.googleapis.com/gmail/v1/users/me/messages?maxResults=20";
        if (nextPageToken) url += "&pageToken=" + nextPageToken;

        const listRes = await fetch(url, { headers: { Authorization: "Bearer " + accessToken } });
        const listData = await listRes.json();

        nextPageToken = listData.nextPageToken || null;

        if (!listData.messages) {
          if (allItems.length === 0) {
            document.getElementById('emailList').innerHTML = '<div class="empty-row">No messages found.</div>';
          }
          setStatus("No more messages.");
          document.getElementById('loadMoreBtn').style.display = 'none';
          return;
        }

        for (const msg of listData.messages) {
          const detailRes = await fetch(
            "https://gmail.googleapis.com/gmail/v1/users/me/messages/" + msg.id +
            "?format=metadata&metadataHeaders=From&metadataHeaders=To&metadataHeaders=Subject&metadataHeaders=Date",
            { headers: { Authorization: "Bearer " + accessToken } }
          );
          const detail = await detailRes.json();
          const headers = (detail.payload && detail.payload.headers) || [];
          const isUnread = (detail.labelIds || []).includes('UNREAD');

          allItems.push({
            id: msg.id,
            from: getHeader(headers, 'From'),
            to: getHeader(headers, 'To'),
            subject: getHeader(headers, 'Subject') || "(no subject)",
            date: getHeader(headers, 'Date'),
            snippet: detail.snippet || "",
            unread: isUnread
          });
        }

        setStatus("Loaded " + allItems.length + " messages.");
        renderList();
        document.getElementById('loadMoreBtn').style.display = nextPageToken ? 'inline-block' : 'none';
      } catch (err) {
        setStatus("Error loading messages: " + err);
      }
    }

    function loadMore() {
      document.getElementById('loadMoreBtn').style.display = 'none';
      setStatus("Loading more messages...");
      fetchPage();
    }

    function renderList() {
      const container = document.getElementById('emailList');
      container.innerHTML = '';
      document.getElementById('countLabel').innerText = allItems.length + (allItems.length === 1 ? ' message' : ' messages');

      for (const item of allItems) {
        const el = document.createElement('div');
        el.className = 'email-item' + (item.unread ? ' unread' : '');
        el.dataset.id = item.id;
        el.innerHTML =
          '<div class="dot"></div>' +
          '<span class="from">' + escapeHtml(cleanSender(item.from)) + '</span>' +
          '<span class="subject-wrap"><span class="subject">' + escapeHtml(item.subject) + '</span><span class="dash">—</span>' + escapeHtml(item.snippet) + '</span>' +
          '<span class="date">' + escapeHtml(formatDate(item.date)) + '</span>';
        el.addEventListener('click', () => openEmail(item.id, el));
        container.appendChild(el);
      }
    }

    function cleanSender(from) {
      // Strip the email address part if a display name is present: "Name <email>" -> "Name"
      const match = from.match(/^"?([^"<]*)"?\s*<.*>$/);
      if (match && match[1].trim()) return match[1].trim();
      return from;
    }

    function showList() {
      document.getElementById('detailView').style.display = 'none';
      document.getElementById('listView').style.display = 'block';
    }

    function showDetail() {
      document.getElementById('listView').style.display = 'none';
      document.getElementById('detailView').style.display = 'block';
    }

    async function openEmail(id, el) {
      el.classList.remove('unread');
      showDetail();

      document.getElementById('detailSubject').innerText = "Loading...";
      document.getElementById('detailFrom').innerText = "";
      document.getElementById('detailTo').innerText = "";
      document.getElementById('detailDate').innerText = "";
      document.getElementById('detailBody').innerText = "";

      try {
        const res = await fetch(
          "https://gmail.googleapis.com/gmail/v1/users/me/messages/" + id + "?format=full",
          { headers: { Authorization: "Bearer " + accessToken } }
        );
        const detail = await res.json();
        const headers = (detail.payload && detail.payload.headers) || [];

        document.getElementById('detailSubject').innerText = getHeader(headers, 'Subject') || "(no subject)";
        document.getElementById('detailFrom').innerText = getHeader(headers, 'From');
        document.getElementById('detailTo').innerText = getHeader(headers, 'To');
        document.getElementById('detailDate').innerText = getHeader(headers, 'Date');
        document.getElementById('detailBody').innerText = extractBody(detail.payload);
      } catch (err) {
        document.getElementById('detailSubject').innerText = "Error loading message";
        document.getElementById('detailBody').innerText = String(err);
      }
    }
  </script>

</body>
</html>
