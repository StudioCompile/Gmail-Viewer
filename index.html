<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mail</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --ink: #1a1a1a;
    --ink-soft: #6b6b6b;
    --ink-faint: #9a9a9a;
    --line: #dcdcdc;
    --line-soft: #ececec;
    --bg: #fafafa;
    --panel: #ffffff;
    --accent: #454545;
    --accent-hover: #2d2d2d;
    --hover: #f4f4f4;
  }

  * { box-sizing: border-box; border-radius: 0 !important; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", "Segoe UI Web", Tahoma, Geneva, Verdana, sans-serif;
  }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 20px;
    height: 40px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    position: relative;
  }

  header h1 {
    font-size: 13.5px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
    color: var(--ink);
  }

  header .spacer { flex: 1; }

  .btn {
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 5px 13px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    cursor: pointer;
  }

  .btn:hover { background: var(--hover); }

  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .btn.primary:hover { background: var(--accent-hover); }

  #status {
    font-size: 11px;
    color: var(--ink-faint);
    text-align: center;
    padding: 5px 0 0 0;
  }

  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: 22px 20px 60px 20px;
  }

  /* Accounts menu */
  #accountsWrap { position: relative; }

  #accountsMenu {
    display: none;
    position: absolute;
    top: 32px;
    right: 0;
    min-width: 220px;
    background: var(--panel);
    border: 1px solid var(--line);
    z-index: 20;
  }

  #accountsMenu.open { display: block; }

  .account-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 12px;
    font-size: 12.5px;
    cursor: pointer;
    border-bottom: 1px solid var(--line-soft);
  }

  .account-row:hover { background: var(--hover); }

  .account-row.active { font-weight: 700; }

  .account-row .email { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .account-row .tag {
    font-size: 10px;
    color: var(--ink-faint);
    flex-shrink: 0;
    margin-left: 8px;
  }

  .menu-action {
    padding: 9px 12px;
    font-size: 12.5px;
    cursor: pointer;
    color: var(--accent);
  }

  .menu-action:hover { background: var(--hover); }

  /* Sign-in modal */
  #signinOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    align-items: center;
    justify-content: center;
    z-index: 50;
  }

  #signinOverlay.open { display: flex; }

  .modal-box {
    background: var(--panel);
    border: 1px solid var(--line);
    width: 320px;
    padding: 28px 26px;
    text-align: center;
  }

  .modal-box h2 {
    font-size: 15.5px;
    margin: 0 0 8px 0;
  }

  .modal-box p {
    font-size: 12.5px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin: 0 0 20px 0;
  }

  /* Inbox list */
  .list-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-bottom: none;
  }

  .list-header .eyebrow {
    font-size: 11px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  #emailList {
    background: var(--panel);
    border: 1px solid var(--line);
  }

  .email-item {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line-soft);
    cursor: pointer;
  }

  .email-item:last-child { border-bottom: none; }

  .email-item:hover { background: var(--hover); }

  .email-item .dot {
    width: 6px;
    height: 6px;
    background: var(--accent);
    flex-shrink: 0;
    visibility: hidden;
    align-self: center;
  }

  .email-item.unread .dot { visibility: visible; }

  .email-item .from {
    font-size: 13px;
    color: var(--ink);
    width: 170px;
    flex-shrink: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .email-item.unread .from { font-weight: 700; }

  .email-item .subject-wrap {
    flex: 1;
    min-width: 0;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--ink-soft);
  }

  .email-item .subject-wrap .subject { color: var(--ink); }

  .email-item.unread .subject-wrap .subject { font-weight: 700; }

  .email-item .subject-wrap .dash { color: var(--ink-faint); margin: 0 4px; }

  .email-item .date {
    font-size: 11.5px;
    color: var(--ink-faint);
    flex-shrink: 0;
    width: 60px;
    text-align: right;
  }

  .loading-row, .empty-row {
    padding: 20px 16px;
    font-size: 13px;
    color: var(--ink-faint);
    text-align: center;
  }

  #loadMoreWrap {
    display: flex;
    justify-content: center;
    margin-top: 16px;
  }

  #loadMoreBtn { display: none; }

  /* Detail view */
  #detailView { display: none; }

  .back-link {
    display: inline-block;
    font-size: 12.5px;
    color: var(--ink-soft);
    cursor: pointer;
    margin-bottom: 16px;
    padding-bottom: 2px;
    border-bottom: 1px solid var(--ink-faint);
  }

  .back-link:hover { color: var(--ink); border-color: var(--ink); }

  .detail-card {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 28px 30px;
  }

  .detail-subject {
    font-size: 19px;
    font-weight: 700;
    margin: 0 0 16px 0;
  }

  .detail-meta {
    border-top: 1px solid var(--line-soft);
    border-bottom: 1px solid var(--line-soft);
    padding: 12px 0;
    margin-bottom: 20px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  .detail-meta .meta-row {
    display: flex;
    gap: 10px;
    margin: 3px 0;
  }

  .detail-meta .meta-label {
    width: 44px;
    flex-shrink: 0;
    font-weight: 700;
    color: var(--ink-faint);
    text-transform: uppercase;
    font-size: 10.5px;
    letter-spacing: 0.4px;
    padding-top: 1px;
  }

  .detail-body {
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--ink);
    white-space: pre-wrap;
    word-wrap: break-word;
  }
</style>
</head>
<body>

  <header>
    <h1>Mail</h1>
    <div class="spacer"></div>
    <div id="accountsWrap">
      <button class="btn" id="accountsBtn" onclick="toggleAccountsMenu()" style="display:none;">Accounts ▾</button>
      <div id="accountsMenu"></div>
    </div>
    <button class="btn primary" id="authBtn" onclick="openSigninModal()">Sign in</button>
  </header>
  <div id="status"></div>

  <div class="page">

    <div id="listView">
      <div class="list-header">
        <span class="eyebrow">Inbox</span>
        <span class="eyebrow" id="countLabel"></span>
      </div>
      <div id="emailList">
        <div class="empty-row">Sign in to see your messages here.</div>
      </div>
      <div id="loadMoreWrap">
        <button class="btn" id="loadMoreBtn" onclick="loadMore()">Load more mail</button>
      </div>
    </div>

    <div id="detailView">
      <span class="back-link" onclick="showList()">← Back to inbox</span>
      <div class="detail-card">
        <p class="detail-subject" id="detailSubject"></p>
        <div class="detail-meta">
          <div class="meta-row"><span class="meta-label">From</span><span id="detailFrom"></span></div>
          <div class="meta-row"><span class="meta-label">To</span><span id="detailTo"></span></div>
          <div class="meta-row"><span class="meta-label">Date</span><span id="detailDate"></span></div>
        </div>
        <div class="detail-body" id="detailBody"></div>
      </div>
    </div>

  </div>

  <div id="signinOverlay">
    <div class="modal-box">
      <h2>Sign in to Mail</h2>
      <p>Connect your Gmail account to view your inbox. You can add more than one account later.</p>
      <button class="btn primary" style="width:100%;" onclick="requestNewAccount()">Continue with Google</button>
    </div>
  </div>

  <script>
    const SCOPES = "https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/userinfo.email";
    const CLIENT_ID = "150167267776-4p30kghhgubv8n18jcd53tq1u41cbhkv.apps.googleusercontent.com";
    const STORAGE_KEY = "mailviewer_accounts";
    const ACTIVE_KEY = "mailviewer_active_email";

    let tokenClient;
    let accounts = {};      // email -> { accessToken, expiresAt }
    let activeEmail = null;
    let nextPageToken = null;
    let allItems = [];

    function loadAccountsFromStorage() {
      try {
        accounts = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      } catch (e) {
        accounts = {};
      }
      activeEmail = localStorage.getItem(ACTIVE_KEY) || null;
    }

    function persistAccounts() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(accounts));
      if (activeEmail) localStorage.setItem(ACTIVE_KEY, activeEmail);
    }

    function setStatus(text) {
      document.getElementById('status').innerText = text;
    }

    function getTokenClient() {
      if (!tokenClient) {
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: SCOPES,
          callback: () => {}, // overridden per-call below
        });
      }
      return tokenClient;
    }

    // Request a brand-new account (shows Google's account chooser / consent once)
    function requestNewAccount() {
      const client = getTokenClient();
      client.callback = async (tokenResponse) => {
        if (tokenResponse.error) {
          setStatus("Sign-in was cancelled or failed.");
          return;
        }
        const email = await fetchEmailForToken(tokenResponse.access_token);
        if (!email) {
          setStatus("Could not read account email.");
          return;
        }
        accounts[email] = {
          accessToken: tokenResponse.access_token,
          expiresAt: Date.now() + (tokenResponse.expires_in * 1000)
        };
        activeEmail = email;
        persistAccounts();
        closeSigninModal();
        refreshUiForSignedIn();
      };
      client.requestAccessToken({ prompt: "consent select_account" });
    }

    // Silently try to refresh a token for an already-known account, without
    // showing the full consent screen again (falls back to a quick popup
    // only if Google requires it, e.g. if the grant expired or was revoked).
    function silentRefresh(email) {
      return new Promise((resolve) => {
        const client = getTokenClient();
        client.callback = (tokenResponse) => {
          if (tokenResponse.error) {
            resolve(false);
            return;
          }
          accounts[email] = {
            accessToken: tokenResponse.access_token,
            expiresAt: Date.now() + (tokenResponse.expires_in * 1000)
          };
          persistAccounts();
          resolve(true);
        };
        client.requestAccessToken({ prompt: "", hint: email });
      });
    }

    async function fetchEmailForToken(token) {
      try {
        const res = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
          headers: { Authorization: "Bearer " + token }
        });
        const data = await res.json();
        return data.email || null;
      } catch (e) {
        return null;
      }
    }

    async function ensureValidToken(email) {
      const acc = accounts[email];
      if (acc && acc.expiresAt - Date.now() > 60000) {
        return acc.accessToken;
      }
      const ok = await silentRefresh(email);
      return ok ? accounts[email].accessToken : null;
    }

    function openSigninModal() {
      document.getElementById('signinOverlay').classList.add('open');
    }

    function closeSigninModal() {
      document.getElementById('signinOverlay').classList.remove('open');
    }

    function toggleAccountsMenu() {
      const menu = document.getElementById('accountsMenu');
      menu.classList.toggle('open');
      if (menu.classList.contains('open')) renderAccountsMenu();
    }

    function renderAccountsMenu() {
      const menu = document.getElementById('accountsMenu');
      menu.innerHTML = '';
      Object.keys(accounts).forEach((email) => {
        const row = document.createElement('div');
        row.className = 'account-row' + (email === activeEmail ? ' active' : '');
        row.innerHTML = '<span class="email">' + escapeHtml(email) + '</span>' +
          (email === activeEmail ? '<span class="tag">active</span>' : '');
        row.onclick = () => switchAccount(email);
        menu.appendChild(row);
      });
      const addRow = document.createElement('div');
      addRow.className = 'menu-action';
      addRow.innerText = '+ Add account';
      addRow.onclick = () => { toggleAccountsMenu(); requestNewAccount(); };
      menu.appendChild(addRow);

      const signOutRow = document.createElement('div');
      signOutRow.className = 'menu-action';
      signOutRow.innerText = 'Remove ' + activeEmail;
      signOutRow.onclick = () => removeActiveAccount();
      menu.appendChild(signOutRow);
    }

    async function switchAccount(email) {
      toggleAccountsMenu();
      activeEmail = email;
      persistAccounts();
      setStatus("Switching to " + email + "...");
      allItems = [];
      nextPageToken = null;
      showList();
      document.getElementById('emailList').innerHTML = '<div class="loading-row">Loading messages...</div>';
      const token = await ensureValidToken(email);
      if (!token) {
        setStatus("Could not sign back into " + email + ". Try adding it again.");
        return;
      }
      setStatus("Connected as " + email + ".");
      fetchPage();
    }

    function removeActiveAccount() {
      delete accounts[activeEmail];
      const remaining = Object.keys(accounts);
      activeEmail = remaining.length ? remaining[0] : null;
      persistAccounts();
      toggleAccountsMenu();
      if (activeEmail) {
        switchAccount(activeEmail);
      } else {
        localStorage.removeItem(ACTIVE_KEY);
        refreshUiForSignedOut();
      }
    }

    function refreshUiForSignedIn() {
      document.getElementById('authBtn').style.display = 'none';
      document.getElementById('accountsBtn').style.display = 'inline-block';
      document.getElementById('accountsBtn').innerText = activeEmail + ' ▾';
      setStatus("Connected as " + activeEmail + ".");
      allItems = [];
      nextPageToken = null;
      document.getElementById('emailList').innerHTML = '<div class="loading-row">Loading messages...</div>';
      fetchPage();
    }

    function refreshUiForSignedOut() {
      document.getElementById('authBtn').style.display = 'inline-block';
      document.getElementById('accountsBtn').style.display = 'none';
      document.getElementById('emailList').innerHTML = '<div class="empty-row">Sign in to see your messages here.</div>';
      document.getElementById('loadMoreBtn').style.display = 'none';
      document.getElementById('countLabel').innerText = '';
      showList();
      setStatus("Signed out.");
    }

    // ---- Gmail data ----

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.innerText = str == null ? "" : str;
      return div.innerHTML;
    }

    function getHeader(headers, name) {
      const h = headers.find(h => h.name.toLowerCase() === name.toLowerCase());
      return h ? h.value : "";
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr);
      if (isNaN(d)) return dateStr || "";
      const now = new Date();
      const sameDay = d.toDateString() === now.toDateString();
      if (sameDay) return d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }

    function decodeBase64Url(data) {
      if (!data) return "";
      let base64 = data.replace(/-/g, '+').replace(/_/g, '/');
      while (base64.length % 4) base64 += '=';
      try {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return new TextDecoder('utf-8').decode(bytes);
      } catch (e) {
        return "";
      }
    }

    function stripHtml(html) {
      const div = document.createElement('div');
      div.innerHTML = html;
      return div.textContent || div.innerText || "";
    }

    function extractBody(payload) {
      let plain = null;
      let html = null;
      function walk(part) {
        if (!part) return;
        if (part.mimeType === 'text/plain' && part.body && part.body.data) {
          plain = plain || decodeBase64Url(part.body.data);
        } else if (part.mimeType === 'text/html' && part.body && part.body.data) {
          html = html || decodeBase64Url(part.body.data);
        }
        if (part.parts) for (const p of part.parts) walk(p);
      }
      walk(payload);
      if (plain) return plain;
      if (html) return stripHtml(html);
      if (payload.body && payload.body.data) return decodeBase64Url(payload.body.data);
      return "(no readable content)";
    }

    function cleanSender(from) {
      const match = from.match(/^"?([^"<]*)"?\s*<.*>$/);
      if (match && match[1].trim()) return match[1].trim();
      return from;
    }

    async function authHeader() {
      const token = await ensureValidToken(activeEmail);
      if (!token) throw new Error("not signed in");
      return { Authorization: "Bearer " + token };
    }

    async function fetchPage() {
      try {
        let url = "https://gmail.googleapis.com/gmail/v1/users/me/messages?maxResults=20";
        if (nextPageToken) url += "&pageToken=" + nextPageToken;

        const headers = await authHeader();
        const listRes = await fetch(url, { headers });
        const listData = await listRes.json();
        nextPageToken = listData.nextPageToken || null;

        if (!listData.messages) {
          if (allItems.length === 0) {
            document.getElementById('emailList').innerHTML = '<div class="empty-row">No messages found.</div>';
          }
          setStatus("No more messages.");
          document.getElementById('loadMoreBtn').style.display = 'none';
          return;
        }

        for (const msg of listData.messages) {
          const dHeaders = await authHeader();
          const detailRes = await fetch(
            "https://gmail.googleapis.com/gmail/v1/users/me/messages/" + msg.id +
            "?format=metadata&metadataHeaders=From&metadataHeaders=To&metadataHeaders=Subject&metadataHeaders=Date",
            { headers: dHeaders }
          );
          const detail = await detailRes.json();
          const hdrs = (detail.payload && detail.payload.headers) || [];
          const isUnread = (detail.labelIds || []).includes('UNREAD');

          allItems.push({
            id: msg.id,
            from: getHeader(hdrs, 'From'),
            subject: getHeader(hdrs, 'Subject') || "(no subject)",
            date: getHeader(hdrs, 'Date'),
            snippet: detail.snippet || "",
            unread: isUnread
          });
        }

        setStatus("Loaded " + allItems.length + " messages.");
        renderList();
        document.getElementById('loadMoreBtn').style.display = nextPageToken ? 'inline-block' : 'none';
      } catch (err) {
        setStatus("Error loading messages: " + err.message);
      }
    }

    function loadMore() {
      document.getElementById('loadMoreBtn').style.display = 'none';
      setStatus("Loading more messages...");
      fetchPage();
    }

    function renderList() {
      const container = document.getElementById('emailList');
      container.innerHTML = '';
      document.getElementById('countLabel').innerText = allItems.length + (allItems.length === 1 ? ' message' : ' messages');

      for (const item of allItems) {
        const el = document.createElement('div');
        el.className = 'email-item' + (item.unread ? ' unread' : '');
        el.dataset.id = item.id;
        el.innerHTML =
          '<div class="dot"></div>' +
          '<span class="from">' + escapeHtml(cleanSender(item.from)) + '</span>' +
          '<span class="subject-wrap"><span class="subject">' + escapeHtml(item.subject) + '</span><span class="dash">—</span>' + escapeHtml(item.snippet) + '</span>' +
          '<span class="date">' + escapeHtml(formatDate(item.date)) + '</span>';
        el.addEventListener('click', () => openEmail(item.id, el));
        container.appendChild(el);
      }
    }

    function showList() {
      document.getElementById('detailView').style.display = 'none';
      document.getElementById('listView').style.display = 'block';
    }

    function showDetail() {
      document.getElementById('listView').style.display = 'none';
      document.getElementById('detailView').style.display = 'block';
    }

    async function openEmail(id, el) {
      el.classList.remove('unread');
      showDetail();

      document.getElementById('detailSubject').innerText = "Loading...";
      document.getElementById('detailFrom').innerText = "";
      document.getElementById('detailTo').innerText = "";
      document.getElementById('detailDate').innerText = "";
      document.getElementById('detailBody').innerText = "";

      try {
        const headers = await authHeader();
        const res = await fetch(
          "https://gmail.googleapis.com/gmail/v1/users/me/messages/" + id + "?format=full",
          { headers }
        );
        const detail = await res.json();
        const hdrs = (detail.payload && detail.payload.headers) || [];

        document.getElementById('detailSubject').innerText = getHeader(hdrs, 'Subject') || "(no subject)";
        document.getElementById('detailFrom').innerText = getHeader(hdrs, 'From');
        document.getElementById('detailTo').innerText = getHeader(hdrs, 'To');
        document.getElementById('detailDate').innerText = getHeader(hdrs, 'Date');
        document.getElementById('detailBody').innerText = extractBody(detail.payload);
      } catch (err) {
        document.getElementById('detailSubject').innerText = "Error loading message";
        document.getElementById('detailBody').innerText = String(err.message || err);
      }
    }

    // Close accounts menu when clicking outside it
    document.addEventListener('click', (e) => {
      const wrap = document.getElementById('accountsWrap');
      if (!wrap.contains(e.target)) {
        document.getElementById('accountsMenu').classList.remove('open');
      }
    });

    // ---- Boot ----
    window.addEventListener('load', () => {
      loadAccountsFromStorage();
      const emails = Object.keys(accounts);
      if (emails.length === 0) {
        openSigninModal();
        return;
      }
      if (!activeEmail || !accounts[activeEmail]) activeEmail = emails[0];
      refreshUiForSignedIn();
    });
  </script>

</body>
</html>
